<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Bus arrival intake</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to intake</a>
  <header class="site-header">
    <div><p class="eyebrow">Exercise intake</p><h1>Bus arrivals</h1></div>
    <div class="header-actions"><span id="identity"></span><button id="logout" class="quiet" type="button" hidden>Sign out</button></div>
  </header>
  <main id="main">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="login-panel" class="panel narrow">
      <h2>Assigned access</h2>
      <p>Enter your exercise access token. It stays in this browser tab and is never placed in a link.</p>
      <form id="login-form">
        <label for="token">Access token</label>
        <input id="token" name="token" type="password" autocomplete="off" required>
        <button type="submit">Open assigned intakes</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="toolbar"><button id="back" type="button" class="quiet" hidden>All assigned buses</button><button id="refresh" type="button" class="quiet">Refresh saved state</button></div>
      <div id="content"></div>
    </section>
  </main>
  <footer>Exercise support only. A photo suggestion is not medical clearance. A referral records a handoff request, not completed care.</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
